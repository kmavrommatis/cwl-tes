#!/usr/bin/env cwl-runner

cwlVersion: v1.0

class: CommandLineTool

doc: "hash input through sha"
$namespaces:
  bms: https://bms.com/

hints:
  - class: DockerRequirement
    dockerPull: kubler/openssl

inputs:
  - id: input
    type: File
    doc: "original content"
    inputBinding:
      position: 1

outputs:
  - id: output
    type: stdout

stdout: sha

baseCommand: ["openssl", "dgst"]

arguments: ["-sha512"]

requirements:
  - class: ResourceRequirement
    ramMin: 60
    ramMax: 60
    bms:queue: longqueue